name: Sync Wednesday Brief papers
on:
  push:
    branches: [main]
    paths:
      - automation/wednesday_brief_papers.json
      - automation/sync_wednesday_brief.py
      - .github/workflows/wednesday-brief-sync.yml
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 2'
permissions:
  contents: read
concurrency:
  group: wednesday-brief-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import curated papers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python automation/sync_wednesday_brief.py
